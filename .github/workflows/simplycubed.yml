name: simplycubed

on:
  workflow_call:
    inputs:
      ref:
        description: Issue or pull request number, used for concurrency.
        required: true
        type: string
      github-app-id:
        description: GitHub App ID for the SimplyCubed App.
        required: true
        type: string
      issue-number:
        description: Issue number to run, when triggered from issues:labeled.
        default: ""
        required: false
        type: string
      pr-number:
        description: Pull request number to address, when triggered from review submission.
        default: ""
        required: false
        type: string
      actor-login:
        description: Login of the labeler or review author.
        required: true
        type: string
      azure-openai-endpoint:
        description: Azure OpenAI endpoint, for example https://resource.openai.azure.com.
        required: true
        type: string
      model:
        description: Engine model or deployment name passed to the SimplyCubed CLI.
        default: gpt-5.4
        required: false
        type: string
      version:
        description: SimplyCubed CLI tag to install.
        default: v0.1.1
        required: false
        type: string
    secrets:
      azure-openai-api-key:
        required: true
      github-app-private-key:
        required: true

jobs:
  run:
    if: ${{ inputs['issue-number'] != '' }}
    runs-on: ubuntu-latest
    concurrency: simplycubed-${{ inputs.ref }}
    permissions: {}
    env:
      AZURE_OPENAI_ENDPOINT: ${{ inputs['azure-openai-endpoint'] }}
      AZURE_OPENAI_API_KEY: ${{ secrets['azure-openai-api-key'] }}
    steps:
      - name: Resolve repository scope
        id: repo
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER}" >> "${GITHUB_OUTPUT}"
          echo "name=${GITHUB_REPOSITORY#*/}" >> "${GITHUB_OUTPUT}"

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs['github-app-id'] }}
          private-key: ${{ secrets['github-app-private-key'] }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve App identity
        id: identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          login="$(gh api graphql -f query='query { viewer { login } }' --jq '.data.viewer.login')"
          if [ -z "${login}" ]; then
            echo "failed to resolve GitHub App login from installation token" >&2
            exit 1
          fi
          echo "login=${login}" >> "${GITHUB_OUTPUT}"
          echo "installation token identity is ${login}"

      - name: Verify installation token permissions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/issues?per_page=1" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/pulls?per_page=1" >/dev/null
          if gh api "repos/${GITHUB_REPOSITORY}/actions/permissions" >/dev/null 2>&1; then
            echo "installation token unexpectedly reached Actions administration" >&2
            exit 1
          fi
          echo "installation token has repo contents/issues/pull-requests access and is denied Actions administration"

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Authorize labeler
        env:
          ACTOR_LOGIN: ${{ inputs['actor-login'] }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR_LOGIN}/permission" --jq .permission)" || {
            echo "actor ${ACTOR_LOGIN} is not authorized to run SimplyCubed on ${GITHUB_REPOSITORY}" >&2
            exit 1
          }
          case "${permission}" in
            write|admin)
              echo "authorized ${ACTOR_LOGIN} with ${permission} permission"
              ;;
            *)
              echo "actor ${ACTOR_LOGIN} must have write or admin on ${GITHUB_REPOSITORY}; got ${permission}" >&2
              exit 1
              ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install SimplyCubed CLI
        run: go install github.com/simplycubed/code/cmd/simplycubed@${{ inputs.version }}

      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.146.0

      - name: Run SimplyCubed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: simplycubed run "${GITHUB_REPOSITORY}#${{ inputs['issue-number'] }}" --model "${{ inputs.model }}" --repo-dir .

  address:
    if: ${{ inputs['pr-number'] != '' }}
    runs-on: ubuntu-latest
    concurrency: simplycubed-${{ inputs.ref }}
    permissions: {}
    env:
      AZURE_OPENAI_ENDPOINT: ${{ inputs['azure-openai-endpoint'] }}
      AZURE_OPENAI_API_KEY: ${{ secrets['azure-openai-api-key'] }}
    steps:
      - name: Resolve repository scope
        id: repo
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER}" >> "${GITHUB_OUTPUT}"
          echo "name=${GITHUB_REPOSITORY#*/}" >> "${GITHUB_OUTPUT}"

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs['github-app-id'] }}
          private-key: ${{ secrets['github-app-private-key'] }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve App identity
        id: identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          login="$(gh api graphql -f query='query { viewer { login } }' --jq '.data.viewer.login')"
          if [ -z "${login}" ]; then
            echo "failed to resolve GitHub App login from installation token" >&2
            exit 1
          fi
          echo "login=${login}" >> "${GITHUB_OUTPUT}"
          echo "installation token identity is ${login}"

      - name: Verify installation token permissions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/issues?per_page=1" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/pulls?per_page=1" >/dev/null
          if gh api "repos/${GITHUB_REPOSITORY}/actions/permissions" >/dev/null 2>&1; then
            echo "installation token unexpectedly reached Actions administration" >&2
            exit 1
          fi
          echo "installation token has repo contents/issues/pull-requests access and is denied Actions administration"

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Skip self-authored review
        id: self-review
        env:
          ACTOR_LOGIN: ${{ inputs['actor-login'] }}
          TOKEN_LOGIN: ${{ steps.identity.outputs.login }}
        run: |
          if [ -n "${TOKEN_LOGIN}" ] && [ "${ACTOR_LOGIN}" = "${TOKEN_LOGIN}" ]; then
            echo "review came from ${TOKEN_LOGIN}; skipping simplycubed address so the agent never addresses its own output"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Authorize reviewer
        if: ${{ steps.self-review.outputs.skip != 'true' }}
        env:
          ACTOR_LOGIN: ${{ inputs['actor-login'] }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR_LOGIN}/permission" --jq .permission)" || {
            echo "actor ${ACTOR_LOGIN} is not authorized to run SimplyCubed on ${GITHUB_REPOSITORY}" >&2
            exit 1
          }
          case "${permission}" in
            write|admin)
              echo "authorized ${ACTOR_LOGIN} with ${permission} permission"
              ;;
            *)
              echo "actor ${ACTOR_LOGIN} must have write or admin on ${GITHUB_REPOSITORY}; got ${permission}" >&2
              exit 1
              ;;
          esac

      - name: Set up Go
        if: ${{ steps.self-review.outputs.skip != 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install SimplyCubed CLI
        if: ${{ steps.self-review.outputs.skip != 'true' }}
        run: go install github.com/simplycubed/code/cmd/simplycubed@${{ inputs.version }}

      - name: Install Codex CLI
        if: ${{ steps.self-review.outputs.skip != 'true' }}
        run: npm install -g @openai/codex@0.146.0

      - name: Address review feedback
        if: ${{ steps.self-review.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SIMPLYCUBED_SELF_LOGIN: ${{ steps.identity.outputs.login }}
        run: simplycubed address "${GITHUB_REPOSITORY}#${{ inputs['pr-number'] }}" --model "${{ inputs.model }}" --repo-dir .
